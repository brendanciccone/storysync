name: "storysync"
description: "Validate design tokens and Storybook-to-Figma variant mappings in CI, with optional drift detection"
author: "Brendan Ciccone"

branding:
  icon: "refresh-cw"
  color: "purple"

inputs:
  storybook_url:
    description: "URL of the running Storybook dev server. With the default, the action starts Storybook itself"
    required: false
    default: "http://localhost:6006"
  components:
    description: "Comma-separated list of component names to validate (default: all)"
    required: false
  node_version:
    description: "Node.js version to use"
    required: false
    default: "22"
  working_directory:
    description: "Directory of the project to check, relative to the repository root. Dependencies are installed, Storybook is started and tokens are read there, and the baseline paths and the files the action writes are relative to it"
    required: false
    default: "."
  install_command:
    description: "Command that installs the project's dependencies, run in working_directory (default: chosen from the lockfile)"
    required: false
    default: ""
  baseline:
    description: "Path to baseline mapping JSON for drift detection"
    required: false
    default: ".storysync/baseline.json"
  create_issue:
    description: "Create or update a GitHub issue when drift is detected"
    required: false
    default: "false"
  fail_on_drift:
    description: "Fail the job when component or token drift is detected. A missing baseline is not drift. Any issue is filed first"
    required: false
    default: "false"
  token_source:
    description: "Token source type: tailwind, css, theme, or auto (default: auto)"
    required: false
    default: "auto"
  token_baseline:
    description: "Path to token baseline JSON for drift detection"
    required: false
    default: ".storysync/tokens-baseline.json"

outputs:
  drift:
    description: "Whether component drift was detected (true/false/new)"
    value: ${{ steps.drift.outputs.result }}
  token_drift:
    description: "Whether token drift was detected (true/false/new, or none when the project has no tokens)"
    value: ${{ steps.token-drift.outputs.result }}
  json:
    description: "JSON mapping output"
    value: ${{ steps.map.outputs.json }}
  tokens_json:
    description: "JSON token extraction output"
    value: ${{ steps.tokens.outputs.json }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}
        # setup-node caches on its own when the workspace's package.json names
        # npm, keyed on a lockfile it expects at the root. That is the
        # consumer's repository, which this action shouldn't cache behind
        # its back, and whose lockfile may be in a subdirectory.
        package-manager-cache: false

    # pnpm/action-setup reads the version from a package.json's packageManager
    # field. Pointed at storysync's own, it installs the pnpm storysync builds
    # with. Given a `version` instead, it would compare that with the
    # consumer's packageManager and fail on any difference, even a +sha512
    # suffix. The path has to be relative to the workspace.
    - name: Locate storysync
      id: storysync
      shell: bash
      run: |
        node -e '
          const path = require("path");
          const pkg = path.resolve(process.env.GITHUB_ACTION_PATH, "..", "package.json");
          console.log("package_json=" + path.relative(process.env.GITHUB_WORKSPACE, pkg));
        ' >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        package_json_file: ${{ steps.storysync.outputs.package_json }}

    - name: Install Safe Chain
      shell: bash
      run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install_command }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          echo "$INSTALL_COMMAND"
          eval "$INSTALL_COMMAND"
          exit 0
        fi

        # The lockfile says which package manager the project uses. In a
        # workspace it sits at the root rather than beside the package, so
        # look upward from working_directory as far as the repository root.
        start="$(pwd -P)"
        root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        dir="$start"
        lockfile=""
        while [ -z "$lockfile" ]; do
          for name in pnpm-lock.yaml yarn.lock package-lock.json npm-shrinkwrap.json bun.lock bun.lockb; do
            if [ -f "$dir/$name" ]; then
              lockfile="$name"
              break
            fi
          done
          if [ -n "$lockfile" ] || [ "$dir" = "$root" ] || [ "$dir" = / ]; then
            break
          fi
          dir="$(dirname "$dir")"
        done

        if [ -z "$lockfile" ]; then
          echo "::error::No lockfile in $start or any directory above it up to the repository root. Commit pnpm-lock.yaml, yarn.lock, package-lock.json or bun.lock, or set install_command."
          exit 1
        fi

        cd "$dir"
        echo "Found $lockfile in $dir"
        case "$lockfile" in
          pnpm-lock.yaml)
            cmd=(pnpm install --frozen-lockfile)
            ;;
          yarn.lock)
            # corepack runs the Yarn version package.json's packageManager
            # names. Node 25 stopped bundling it; without it, whatever yarn is
            # on PATH has to do.
            if command -v corepack > /dev/null; then
              corepack enable yarn
              export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            fi
            if ! command -v yarn > /dev/null; then
              echo "::error::Found yarn.lock, but yarn isn't installed and this Node has no corepack to provide it. Install Yarn before this action, or set install_command."
              exit 1
            fi
            # Yarn 1 writes a v1 lockfile and spells the flag differently.
            if grep -q '^# yarn lockfile v1' yarn.lock; then
              cmd=(yarn install --frozen-lockfile)
            else
              cmd=(yarn install --immutable)
            fi
            ;;
          package-lock.json | npm-shrinkwrap.json)
            cmd=(npm ci)
            ;;
          bun.lock | bun.lockb)
            if ! command -v bun > /dev/null; then
              echo "::error::Found $lockfile, but bun isn't installed. Add oven-sh/setup-bun before this action, or set install_command."
              exit 1
            fi
            cmd=(bun install --frozen-lockfile)
            ;;
        esac
        echo "${cmd[*]}"
        "${cmd[@]}"

    - name: Build storysync
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/.."
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm run build

    - name: Start Storybook
      if: inputs.storybook_url == 'http://localhost:6006'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        STORYBOOK_URL: ${{ inputs.storybook_url }}
      run: |
        # The binary the install linked, here or in a parent: npm and Yarn
        # workspaces hoist it to the root. Running it directly rather than
        # through npx means a missing Storybook is an error, not a download.
        root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        dir="$(pwd -P)"
        storybook=""
        while :; do
          if [ -x "$dir/node_modules/.bin/storybook" ]; then
            storybook="$dir/node_modules/.bin/storybook"
            break
          fi
          if [ "$dir" = "$root" ] || [ "$dir" = / ]; then
            break
          fi
          dir="$(dirname "$dir")"
        done
        if [ -z "$storybook" ]; then
          echo "::error::Storybook isn't installed: there is no node_modules/.bin/storybook in $(pwd -P) or above it. Add storybook to the project's devDependencies, or start Storybook yourself and set storybook_url. Yarn Plug'n'Play projects need nodeLinker: node-modules."
          exit 1
        fi

        log="$RUNNER_TEMP/storysync-storybook.log"
        "$storybook" dev --port 6006 --ci > "$log" 2>&1 &
        pid=$!

        # Polled with curl because `npx wait-on` fetches an unpinned package
        # on every run.
        deadline=$((SECONDS + 120))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if curl -fs -o /dev/null --max-time 5 "$STORYBOOK_URL"; then
            cat "$log"
            echo "Storybook is serving $STORYBOOK_URL"
            exit 0
          fi
          if ! kill -0 "$pid" 2> /dev/null; then
            cat "$log"
            echo "::error::Storybook exited before it started serving. Its output is above."
            exit 1
          fi
          sleep 1
        done
        cat "$log"
        echo "::error::Storybook didn't answer at $STORYBOOK_URL within 120 seconds. Its output is above."
        exit 1

    - name: Extract tokens
      id: tokens
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TOKEN_SOURCE: ${{ inputs.token_source }}
      run: |
        STORYSYNC_CLI="$GITHUB_ACTION_PATH/../dist/cli/index.js"
        ARGS=(--project . --json)
        if [ "$TOKEN_SOURCE" != "auto" ]; then
          ARGS+=(--source "$TOKEN_SOURCE")
        fi
        node "$STORYSYNC_CLI" tokens "${ARGS[@]}" > storysync-tokens-current.json
        {
          echo "json<<STORYSYNC_TOKENS_EOF"
          cat storysync-tokens-current.json
          echo "STORYSYNC_TOKENS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Detect token drift
      id: token-drift
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TOKEN_BASELINE_PATH: ${{ inputs.token_baseline }}
      run: |
        node << 'SCRIPT'
        const fs = require("fs");

        const baselinePath = process.env.TOKEN_BASELINE_PATH;
        const current = JSON.parse(fs.readFileSync("storysync-tokens-current.json", "utf8"));

        if (!current.collections || !current.collections.length) {
          console.log("No tokens found in project");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=none\n");
          process.exit(0);
        }

        if (!fs.existsSync(baselinePath)) {
          console.log("No token baseline found at " + baselinePath + " — first run");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=new\n");
          process.exit(0);
        }

        const baseline = JSON.parse(fs.readFileSync(baselinePath, "utf8"));
        const baseMap = Object.fromEntries((baseline.collections || []).map(c => [c.category, c]));
        const currMap = Object.fromEntries(current.collections.map(c => [c.category, c]));

        const added = [];
        const removed = [];
        const changed = [];

        for (const [cat, coll] of Object.entries(currMap)) {
          const base = baseMap[cat];
          if (!base) { added.push({ category: cat, count: coll.tokens.length }); continue; }
          const baseTokens = Object.fromEntries(base.tokens.map(t => [t.name, t.value]));
          let newCount = 0, changedCount = 0;
          for (const t of coll.tokens) {
            if (!(t.name in baseTokens)) newCount++;
            else if (baseTokens[t.name] !== t.value) changedCount++;
          }
          if (newCount || changedCount) changed.push({ category: cat, added: newCount, changed: changedCount });
        }
        for (const [cat, coll] of Object.entries(baseMap)) {
          const curr = currMap[cat];
          if (!curr) {
            removed.push({ category: cat, count: coll.tokens.length });
            continue;
          }
          const currTokens = new Set(curr.tokens.map(t => t.name));
          const removedCount = coll.tokens.filter(t => !currTokens.has(t.name)).length;
          if (removedCount) removed.push({ category: cat, count: removedCount });
        }

        if (!added.length && !removed.length && !changed.length) {
          console.log("No token drift detected");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=false\n");
          process.exit(0);
        }

        fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=true\n");

        let body = "## Token drift\n\n";
        if (added.length) {
          body += "### New collections\n";
          for (const a of added) body += "- **" + a.category + "** (" + a.count + " tokens)\n";
          body += "\n";
        }
        if (removed.length) {
          body += "### Removed tokens\n";
          for (const r of removed) body += "- **" + r.category + "**: " + r.count + " token(s) removed\n";
          body += "\n";
        }
        if (changed.length) {
          body += "### Changed collections\n";
          for (const c of changed) body += "- **" + c.category + "**: " + c.added + " added, " + c.changed + " changed\n";
          body += "\n";
        }

        fs.writeFileSync("storysync-token-drift.md", body);
        console.log(body);
        SCRIPT

    - name: Map components
      id: map
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        STORYBOOK_URL: ${{ inputs.storybook_url }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        STORYSYNC_CLI="$GITHUB_ACTION_PATH/../dist/cli/index.js"
        ARGS=(--storybook "$STORYBOOK_URL" --json)
        if [ -n "$COMPONENTS" ]; then
          ARGS+=(--components "$COMPONENTS")
        fi
        node "$STORYSYNC_CLI" map "${ARGS[@]}" > storysync-current.json
        {
          echo "json<<STORYSYNC_EOF"
          cat storysync-current.json
          echo "STORYSYNC_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Detect drift
      id: drift
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BASELINE_PATH: ${{ inputs.baseline }}
      run: |
        node << 'SCRIPT'
        const fs = require("fs");

        const baselinePath = process.env.BASELINE_PATH;
        const current = JSON.parse(fs.readFileSync("storysync-current.json", "utf8"));

        if (!fs.existsSync(baselinePath)) {
          console.log("No baseline found at " + baselinePath + " — first run");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=new\n");
          process.exit(0);
        }

        const baseline = JSON.parse(fs.readFileSync(baselinePath, "utf8"));
        const baseMap = Object.fromEntries(baseline.components.map(c => [c.name, c]));
        const currMap = Object.fromEntries(current.components.map(c => [c.name, c]));

        const added = current.components.filter(c => !baseMap[c.name]);
        const removed = baseline.components.filter(c => !currMap[c.name]);
        const changed = current.components.filter(c => {
          const b = baseMap[c.name];
          return b && JSON.stringify(b) !== JSON.stringify(c);
        });

        if (!added.length && !removed.length && !changed.length) {
          console.log("No drift detected");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=false\n");
          process.exit(0);
        }

        fs.appendFileSync(process.env.GITHUB_OUTPUT, "result=true\n");

        let body = "## Storybook to Figma drift detected\n\n";
        body += "The variant mappings have changed since the last baseline.\n\n";

        if (added.length) {
          body += "### Added\n";
          for (const c of added) body += "- **" + c.name + "** (" + c.combinations + " combinations)\n";
          body += "\n";
        }
        if (removed.length) {
          body += "### Removed\n";
          for (const c of removed) body += "- **" + c.name + "**\n";
          body += "\n";
        }
        if (changed.length) {
          body += "### Changed\n";
          for (const c of changed) {
            const b = baseMap[c.name];
            body += "- **" + c.name + "**: " + b.variantProperties.length + " → " + c.variantProperties.length + " props, ";
            body += b.combinations + " → " + c.combinations + " combinations\n";
          }
          body += "\n";
        }

        body += "| Metric | Baseline | Current |\n|---|---|---|\n";
        body += "| Components | " + baseline.summary.total + " | " + current.summary.total + " |\n";
        body += "| Combinations | " + baseline.summary.totalCombinations + " | " + current.summary.totalCombinations + " |\n";
        body += "| Capped | " + baseline.summary.capped + " | " + current.summary.capped + " |\n";
        body += "| Failed | " + baseline.summary.failed + " | " + current.summary.failed + " |\n";

        fs.writeFileSync("storysync-drift.md", body);
        console.log(body);
        SCRIPT

    - name: Create or update issue
      if: inputs.create_issue == 'true' && (steps.drift.outputs.result == 'true' || steps.token-drift.outputs.result == 'true')
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh label create storysync-drift --description "Storybook-to-Figma mapping drift" --color "d93f0b" 2>/dev/null || true
        # Combine token drift and component drift into one issue body
        BODY=""
        if [ -f storysync-token-drift.md ]; then
          BODY=$(cat storysync-token-drift.md)
          BODY="$BODY"$'\n'
        fi
        if [ -f storysync-drift.md ]; then
          BODY="$BODY$(cat storysync-drift.md)"
        fi
        echo "$BODY" > storysync-combined-drift.md

        EXISTING=$(gh issue list --label storysync-drift --state open --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$EXISTING" ]; then
          gh issue edit "$EXISTING" --body-file storysync-combined-drift.md
          echo "Updated issue #$EXISTING"
        else
          gh issue create \
            --title "storysync: drift detected" \
            --body-file storysync-combined-drift.md \
            --label storysync-drift
        fi

    # Last, so a drift issue is still filed before the job fails.
    - name: Fail on drift
      if: inputs.fail_on_drift == 'true' && (steps.drift.outputs.result == 'true' || steps.token-drift.outputs.result == 'true')
      shell: bash
      env:
        DRIFT: ${{ steps.drift.outputs.result }}
        TOKEN_DRIFT: ${{ steps.token-drift.outputs.result }}
        BASELINE_PATH: ${{ inputs.baseline }}
        TOKEN_BASELINE_PATH: ${{ inputs.token_baseline }}
      run: |
        if [ "$DRIFT" = true ]; then
          echo "::error::Component variants differ from $BASELINE_PATH. Detect drift lists the changes; if they're intended, replace the baseline with storysync-current.json."
        fi
        if [ "$TOKEN_DRIFT" = true ]; then
          echo "::error::Design tokens differ from $TOKEN_BASELINE_PATH. Detect token drift lists the changes; if they're intended, replace the baseline with storysync-tokens-current.json."
        fi
        exit 1
