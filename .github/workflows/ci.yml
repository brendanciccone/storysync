name: CI

on:
  # Only the default branch on push. Branch work is covered by `pull_request`,
  # and listening to both would run the whole matrix twice on the same commit
  # for any branch that has a PR open.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same matrix before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18. 24 is also the version
        # release.yml publishes with.
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check (including tests)
        run: pnpm lint

      # Compiles to dist/ and runs the suite. The CLI smoke tests exercise the
      # compiled dist/cli/index.js, so this covers the published artifact too.
      - name: Test
        run: pnpm test

  # Runs the drift-check action the way a consumer does, against the example
  # project: install from its lockfile, start its Storybook, map it, compare.
  # Twice: with no baseline, drift has to come back `new`; against the
  # committed one, `false`, with fail_on_drift failing the job otherwise.
  # Then twice more, reusing the install, where the action has to fail:
  # fail_on_drift with no baseline, and port 6006 already taken.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: no-baseline
        uses: ./action
        with:
          working_directory: examples/storybook-vite
          baseline: .storysync/missing.json

      - name: Check the outputs without a baseline
        env:
          DRIFT: ${{ steps.no-baseline.outputs.drift }}
          TOKEN_DRIFT: ${{ steps.no-baseline.outputs.token_drift }}
          MAP_JSON: ${{ steps.no-baseline.outputs.json }}
          TOKENS_JSON: ${{ steps.no-baseline.outputs.tokens_json }}
        run: |
          set -euo pipefail
          echo "drift=$DRIFT token_drift=$TOKEN_DRIFT"
          if [ "$DRIFT" != new ]; then
            echo "::error::drift is '$DRIFT', expected 'new': there is no baseline at .storysync/missing.json"
            exit 1
          fi
          # none while the example has no token source, new once it has one.
          if [ "$TOKEN_DRIFT" != none ] && [ "$TOKEN_DRIFT" != new ]; then
            echo "::error::token_drift is '$TOKEN_DRIFT', expected 'none' or 'new'"
            exit 1
          fi
          if [ -z "$TOKENS_JSON" ]; then
            echo "::error::tokens_json is empty"
            exit 1
          fi
          node -e '
            const tokens = JSON.parse(process.env.TOKENS_JSON);
            if (!Array.isArray(tokens.collections)) throw new Error("tokens_json has no collections array");
            const map = JSON.parse(process.env.MAP_JSON);
            const names = map.components.map((c) => c.name);
            console.log("Mapped: " + names.join(", "));
            if (!names.includes("Button")) throw new Error("json does not list Button");
            if (map.summary.failed) throw new Error(map.summary.failed + " component(s) failed to map");
          '

      # examples/storybook-vite/.storysync/baseline.json is `storysync map
      # --json` of the example, so a change to its components or stories has
      # to regenerate it. Use this checkout's build rather than the npx
      # command this step's failure gives, which runs the release on npm. With
      # the example's Storybook running on 6006:
      #
      #   pnpm build && cd examples/storybook-vite && node ../../dist/cli/index.js map --storybook http://localhost:6006 --json > .storysync/baseline.json
      - id: baseline
        uses: ./action
        with:
          working_directory: examples/storybook-vite
          fail_on_drift: 'true'

      - name: Check the outputs against the baseline
        env:
          DRIFT: ${{ steps.baseline.outputs.drift }}
          TOKEN_DRIFT: ${{ steps.baseline.outputs.token_drift }}
        run: |
          set -euo pipefail
          echo "drift=$DRIFT token_drift=$TOKEN_DRIFT"
          if [ "$DRIFT" != false ]; then
            echo "::error::drift is '$DRIFT', expected 'false' against examples/storybook-vite/.storysync/baseline.json"
            exit 1
          fi
          # With fail_on_drift, a token_drift of new would have failed the action.
          if [ "$TOKEN_DRIFT" != none ] && [ "$TOKEN_DRIFT" != false ]; then
            echo "::error::token_drift is '$TOKEN_DRIFT', expected 'none' or 'false'"
            exit 1
          fi

      # With nothing to compare against, fail_on_drift has to fail: a green
      # job would mean a misnamed baseline passes forever. The map output
      # proves the failure came after mapping, not from setup.
      - name: Clear the last run's map output
        run: rm -f examples/storybook-vite/storysync-current.json

      - id: missing-baseline
        name: Run the action without a baseline (has to fail)
        uses: ./action
        continue-on-error: true
        with:
          working_directory: examples/storybook-vite
          install_command: 'true'
          baseline: .storysync/missing.json
          fail_on_drift: 'true'

      - name: Check the action failed without a baseline
        env:
          OUTCOME: ${{ steps.missing-baseline.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the action's outcome is '$OUTCOME', expected 'failure': fail_on_drift has to fail when there is no baseline at .storysync/missing.json"
            exit 1
          fi
          if [ ! -f examples/storybook-vite/storysync-current.json ]; then
            echo "::error::the action failed before mapping components, so the missing baseline wasn't what failed it"
            exit 1
          fi

      # Something else on 6006: the action has to fail at Start Storybook
      # rather than map whatever answers there. Extract tokens runs right
      # after Start Storybook, so its output must not appear.
      - id: port-server
        name: Serve something else on port 6006
        run: |
          rm -f examples/storybook-vite/storysync-tokens-current.json
          python3 -m http.server 6006 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > /dev/null 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 20); do
            if curl -fs -o /dev/null http://localhost:6006; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::python3 -m http.server didn't start serving on port 6006"
          exit 1

      - id: port-taken
        name: Run the action with port 6006 taken (has to fail)
        uses: ./action
        continue-on-error: true
        with:
          working_directory: examples/storybook-vite
          install_command: 'true'

      - name: Check the action failed on the taken port
        env:
          OUTCOME: ${{ steps.port-taken.outcome }}
          SERVER_PID: ${{ steps.port-server.outputs.pid }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the action's outcome is '$OUTCOME', expected 'failure': something else was already serving port 6006"
            exit 1
          fi
          if [ -f examples/storybook-vite/storysync-tokens-current.json ]; then
            echo "::error::the action got past Start Storybook with something else on port 6006"
            exit 1
          fi
          if ! kill -0 "$SERVER_PID" 2> /dev/null; then
            echo "::error::the server on port 6006 is gone: the action should have left it alone"
            exit 1
          fi

      - name: Stop the server on port 6006
        if: always() && steps.port-server.outputs.pid != ''
        env:
          SERVER_PID: ${{ steps.port-server.outputs.pid }}
        run: kill "$SERVER_PID" 2> /dev/null || true
